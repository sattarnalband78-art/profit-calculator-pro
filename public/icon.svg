<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061326" />
      <stop offset="100%" stop-color="#0B203E" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-opacity="0.4" />

  <!-- Background Growth Chart Mesh -->
  <path d="M 96 360 Q 200 320, 280 240 T 416 140 L 416 380 L 96 380 Z" fill="url(#glowGrad)" />

  <!-- Growth Line -->
  <path d="M 96 360 Q 200 320, 280 240 T 416 140" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Arrow Head -->
  <path d="M 370 140 L 416 140 L 416 186" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main Rupee Badge Shield -->
  <g transform="translate(140, 160)" filter="url(#shadow)">
    <rect width="180" height="180" rx="40" fill="#061326" stroke="url(#emeraldGrad)" stroke-width="6" />
    
    <!-- Indian Rupee Symbol (₹) -->
    <text x="90" y="125" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="105" fill="url(#emeraldGrad)" text-anchor="middle">₹</text>
  </g>

  <!-- Sparkle Accent -->
  <circle cx="416" cy="140" r="12" fill="#6EE7B7" />
</svg>
