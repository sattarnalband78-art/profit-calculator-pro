name: Android Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Sign and Align Release APK
        id: sign_apk
        run: |
          # Prioritize the exact standard output path from assembleRelease
          RAW_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          
          if [ ! -f "$RAW_APK" ]; then
            echo "$RAW_APK not found at direct path. Searching under android/app/build/outputs/apk/..."
            RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*signed*" ! -name "*aligned*" | head -n 1)
          fi
          
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "Error: No APK found after assembleRelease."
            ls -laR android/app/build/outputs/ || true
            exit 1
          fi
          
          echo "Target Raw APK: $RAW_APK"
          OUTPUT_DIR="$(dirname "$RAW_APK")"
          
          # Locate Android build-tools
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build-Tools: $BUILD_TOOLS"
          
          ALIGNED_APK="${OUTPUT_DIR}/app-release-aligned.apk"
          FINAL_SIGNED_APK="${OUTPUT_DIR}/NOMAN-Profit-Calculator-Pro-release-signed.apk"
          
          # Step 1: 4-byte Page Alignment
          echo "Aligning APK with zipalign..."
          $BUILD_TOOLS/zipalign -f -p 4 "$RAW_APK" "$ALIGNED_APK"
          
          # Step 2: Keystore resolution & signing
          KEYSTORE_FILE="/tmp/release.keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Signing with Custom GitHub Repository Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            KS_ALIAS="${{ secrets.KEY_ALIAS }}"
            KS_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "Generating standard release signing key..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias noman_release_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass nomanrelease123 \
              -keypass nomanrelease123 \
              -dname "CN=NOMAN Profit Calculator Pro, OU=NOMAN, O=NOMAN, L=Mumbai, ST=Maharashtra, C=IN"
            KS_ALIAS="noman_release_key"
            KS_PASS="nomanrelease123"
          fi
          
          # Step 3: Sign using apksigner (v1, v2, v3 schemes)
          echo "Signing APK with apksigner (v1, v2, v3 schemes)..."
          $BUILD_TOOLS/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$FINAL_SIGNED_APK" \
            "$ALIGNED_APK"
            
          rm -f "$KEYSTORE_FILE" "$ALIGNED_APK"
          
          # Step 4: Verification
          echo "=== APK Signature & Integrity Verification ==="
          $BUILD_TOOLS/apksigner verify --verbose --print-certs "$FINAL_SIGNED_APK"
          
          echo "Release APK successfully aligned and signed: $FINAL_SIGNED_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NOMAN-Profit-Calculator-Pro-Signed-APK
          path: android/app/build/outputs/apk/release/NOMAN-Profit-Calculator-Pro-release-signed.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true
