The microphone voice-input system in Profit Calculator Pro has been updated and tested for compatibility with Android Chrome and desktop browsers.
What Was Fixed & Implemented
Permissions Policy:
Added "microphone" permission to requestFramePermissions in metadata.json so the browser allows microphone access inside iframe preview windows.
Android Chrome Compatibility:
Utilized window.SpeechRecognition || window.webkitSpeechRecognition with direct synchronous execution in the click handler thread to trigger native browser microphone permission prompts.
Prevented default event propagation (event.preventDefault(), event.stopPropagation()) on touch to avoid input focus/keyboard flickering during voice recording.
Active Visual Indicators:
Implemented an animated pulsing red microphone button state (ring-2 ring-rose-400 animate-pulse) when recording is active.
Real-time status toast bar shows "Listening..." with a live transcript preview as the user speaks.
Multi-Language Support (English, Hindi, Marathi):
Voice input handles en-IN (English India), hi-IN (Hindi), and mr-IN (Marathi).
parseSpokenNumber converts ASCII digits, Devanagari numerals (०-९), and spoken terms (e.g., sattar, paanch sau, deed she, shambhar, sau, hazar, lakh) directly into clean numeric values for Cost Price, Selling Price, and Quantity.
Error & Fallback Handling:
Handles onerror events (not-allowed, no-speech, audio-capture, network) with clear user messages.
Shows an explicit message if Speech Recognition is unsupported in the current browser.
Calculator Synchronization:
Recognized spoken words automatically populate the selected field (Product Name, Cost Price, Selling Price, or Quantity), briefly highlight the field in emerald green, and trigger profit/loss calculation.
