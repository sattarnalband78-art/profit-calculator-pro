I have updated the GitHub Actions deployment workflow for Profit Calculator Pro to fix the GitHub Pages build error.
What Was Fixed
Removed cache: 'npm' from actions/setup-node@v4 so GitHub Actions no longer requires a package-lock.json file for npm dependency caching.
Used npm install instead of npm ci so dependencies install reliably without a lockfile.
Created/updated .github/workflows/main.yml in your repository.
Complete Updated .github/workflows/main.yml Code
code
Yaml
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
